name: TRACE Acta fixtures
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  trace-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The fixtures this checks, 07 to 11 among them, are on agentrust-io/trace-spec main since #592 merged on
      # 20 October 2026, as commit b8d2ce61. The checkout is that commit itself, not a branch, so a later change to
      # trace-spec cannot move the check without a commit here. To move it: set TRACE_SPEC_SHA to the new commit, run
      # scripts/trace-fixtures.mjs --write, and commit docs/trace-fixtures.md.
      TRACE_SPEC_SHA: b8d2ce6161e57d41dd0b49be78efc05e86baeca5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: agentrust-io/trace-spec
          ref: ${{ env.TRACE_SPEC_SHA }}
          path: trace-spec
          persist-credentials: false
      - name: The trace-spec checkout is the pinned commit
        run: test "$(git -C trace-spec rev-parse HEAD)" = "$TRACE_SPEC_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - run: npm ci
      - name: Run every fixture through cli.js and compare with docs/trace-fixtures.md
        run: node scripts/trace-fixtures.mjs --trace-spec trace-spec --commit "$TRACE_SPEC_SHA" --check
