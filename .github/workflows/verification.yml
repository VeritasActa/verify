name: Verification regression gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
      - run: npm ci
      - run: npm test
      - run: npm run check:browser && npm run check:sigil && npm run self-check && npm run test:conformance
      - run: npm pack --json > packed.json
      - run: node scripts/release-install-check.mjs
